[pytest]
# Temporary-directory retention for the pytest tmp_path factories
# (pytest ini options tmp_path_retention_*; see the pytest reference:
# https://docs.pytest.org/en/stable/reference.html#confval-tmp_path_retention_policy).
#
#   tmp_path_retention_policy = failed
#       Per-test temporary directories are removed as each test passes, and
#       the whole session basetemp is removed when the session succeeds.
#       Directories are retained ONLY when tests fail, preserving the
#       debugging value of the failed test's artifacts.
#   tmp_path_retention_count = 2
#       At most the 2 most recent sessions are ever retained under
#       <tempdir>/pytest-of-<user>/; anything older (including sessions
#       killed mid-run, which skip pytest's session-finish cleanup) is
#       pruned by conftest.py at session start.
#
# Policy rationale and before/after measurements:
#   docs/evaluation/test-infrastructure-improvements.md
tmp_path_retention_policy = failed
tmp_path_retention_count = 2
